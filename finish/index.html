<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex,nofollow">
<title>Finishing your seat | Catalyst Works</title>
<!--
  Abandoned-checkout recovery hop. It was linked from the July recovery emails
  and sent people back to the free-seat Stripe link to finish what they started.

  2026-08-04: RETARGETED to /workshop/. That free-seat payment link was
  deactivated in Stripe today, because it was still live and still giving away
  a $0 seat at a session that now costs money. A deactivated link renders a
  Stripe error page, so this hop had stopped recovering anybody and started
  dead-ending them instead.

  The page stays rather than being deleted: the URL is sitting in sent emails
  that cannot be recalled, and a redirect to the live page is a better landing
  than a 404. The campaign tag moves off the finished per-event campaign to the
  permanent one for the same reason the other legacy routes did, so a click
  arriving now is not counted inside a campaign that is over.

  Do NOT point this at a payment link again. It is reachable only from old mail
  and has no way to know which session the reader was trying to buy. The
  permanent page always knows.
-->
<meta http-equiv="refresh" content="0;url=https://catalystworks.consulting/workshop/?utm_source=email&utm_medium=recovery&utm_campaign=ic_workshop_permanent&utm_content=abandoned_checkout">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231A1410'/%3E%3Ctext x='16' y='23' font-family='Arial Black,sans-serif' font-size='22' font-weight='900' fill='%23E8632A' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#1A1410; --ink-faint:#8A7E6C;
  --paper:#EFE7D6;
  --amber:#E8632A; --amber-deep:#C24A18;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.box{max-width:420px}
.spin{width:34px;height:34px;margin:0 auto 18px;border-radius:50%;border:3px solid rgba(26,20,16,.14);
  border-top-color:var(--amber);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:1.02rem;font-weight:600}
a{display:inline-block;margin-top:14px;color:var(--amber-deep);font-size:.9rem;text-decoration:underline}
</style>
</head>
<body>
<div class="box">
  <div class="spin" aria-hidden="true"></div>
  <p>Taking you to finish your seat&hellip;</p>
  <a href="https://catalystworks.consulting/workshop/?utm_source=email&utm_medium=recovery&utm_campaign=ic_workshop_permanent&utm_content=abandoned_checkout">Continue to your seat</a>
</div>
<script>
window.location.replace("https://catalystworks.consulting/workshop/?utm_source=email&utm_medium=recovery&utm_campaign=ic_workshop_permanent&utm_content=abandoned_checkout");
</script>
</body>
</html>
